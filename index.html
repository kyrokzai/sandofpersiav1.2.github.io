<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sand Prince 2026 Pro v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

</head>
<body>
<canvas id="game"></canvas>

<script>
"use strict";

/* =========================
   BASE
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 960;
const H = 540;
const GAME_H = 450;
const WORLD_W = 5350;
const GRAVITY = 1580;

let DPR = window.devicePixelRatio || 1;

function resize(){
  DPR = window.devicePixelRatio || 1;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener("resize",resize);

const SAVE_KEY = "sand_prince_2026_v2_save";

let save = {};
try{
  save = JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
}catch{
  save = {};
}
save.wins ??= 0;
save.bestTime ??= 0;
save.bossKills ??= 0;

function saveGame(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}

/* =========================
   GAME STATE
========================= */

let state = {
  screen:"menu",
  time:0,
  cameraX:0,
  shake:0,
  msg:"",
  msgTime:0,
  finished:false
};

let player;
let boss;
let platforms = [];
let spikes = [];
let enemies = [];
let particles = [];
let floatTexts = [];
let torches = [];
let decor = [];
let buttons = [];

let keys = {};
let activePointers = new Map();

let mobile = {
  left:false,
  right:false,
  jump:false,
  attack:false
};

let keyItem = {
  x:2035,
  y:218,
  taken:false
};

let door = {
  x:5120,
  y:302,
  w:62,
  h:88
};

let last = performance.now();

/* =========================
   AUDIO
========================= */

let audioCtx = null;
let soundEnabled = true;

function ensureAudio(){
  if(!soundEnabled) return;
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq,dur,type="sine",vol=0.07,slide=0){
  if(!soundEnabled || !audioCtx) return;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq,now);

  if(slide !== 0){
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),now+dur);
  }

  gain.gain.setValueAtTime(vol,now);
  gain.gain.exponentialRampToValueAtTime(0.001,now+dur);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+dur);
}

function sound(name){
  ensureAudio();

  if(name==="jump") tone(420,0.08,"triangle",0.08,230);
  if(name==="slash") tone(760,0.06,"sawtooth",0.05,-350);
  if(name==="hit") tone(180,0.08,"square",0.07,-70);
  if(name==="hurt") tone(120,0.16,"sawtooth",0.09,-50);
  if(name==="key"){
    tone(640,0.08,"triangle",0.07,180);
    setTimeout(()=>tone(880,0.1,"triangle",0.07,150),90);
  }
  if(name==="boss"){
    tone(70,0.25,"sawtooth",0.1,-20);
    setTimeout(()=>tone(95,0.2,"square",0.07,-25),120);
  }
  if(name==="win"){
    tone(520,0.12,"triangle",0.08,100);
    setTimeout(()=>tone(720,0.12,"triangle",0.08,100),120);
    setTimeout(()=>tone(960,0.2,"triangle",0.08,160),260);
  }
  if(name==="click") tone(420,0.05,"triangle",0.05,80);
}

/* =========================
   LEVEL
========================= */

function buildLevel(){
  platforms = [];
  spikes = [];
  torches = [];
  decor = [];

  const plat = (x,y,w,h,color="sand") => platforms.push({x,y,w,h,color});
  const deco = (type,x,y,data={}) => decor.push({type,x,y,...data});

  /*
    Уровень построен логично:
    1. Безопасный старт.
    2. Обучение прыжкам.
    3. Первый враг.
    4. Верхний путь к ключу.
    5. Спуск через ловушки.
    6. Коридор напряжения.
    7. Арена босса.
    8. Дверь.
  */

  // Старт.
  plat(0,390,640,60);
  plat(270,318,220,32);
  plat(560,286,190,32);

  // Первый прыжковый разрыв.
  plat(720,390,520,60);
  plat(915,326,210,32);

  // Зал первого врага.
  plat(1320,390,600,60);
  plat(1390,318,190,32);
  plat(1640,286,200,32);

  // Верхний маршрут к ключу.
  plat(1900,258,270,32);
  plat(2020,390,590,60);
  plat(2230,300,190,32);
  plat(2500,332,190,32);

  // Спуск и проверка прыжков.
  plat(2710,390,540,60);
  plat(3060,318,250,32);

  // Коридор перед боссом.
  plat(3370,390,560,60);
  plat(3560,306,230,32);

  // Большая арена босса.
  plat(3980,390,1220,60);
  plat(4270,320,170,26,"dark");
  plat(4490,270,190,26,"dark");
  plat(4750,320,170,26,"dark");

  // Высокие декоративные балконы.
  plat(85,145,180,30,"dark");
  plat(760,150,220,30,"dark");
  plat(1490,140,260,30,"dark");
  plat(2490,150,260,30,"dark");
  plat(3190,142,300,30,"dark");
  plat(4380,142,340,30,"dark");

  // Ловушки.
  spikes.push(
    {x:660,y:374,w:38,h:16},
    {x:1260,y:374,w:42,h:16},
    {x:1950,y:374,w:42,h:16},
    {x:2638,y:374,w:42,h:16},
    {x:3290,y:374,w:48,h:16},
    {x:4050,y:374,w:70,h:16}
  );

  for(const x of [
    170,410,790,1080,1430,1760,
    2050,2380,2810,3160,3500,3820,
    4250,4530,4860,5160
  ]){
    torches.push({x,y:350});
  }

  // Визуальные зоны.
  deco("arch",120,390,{w:170,h:220});
  deco("banner",360,160,{h:120,color1:"#1bb7ff",color2:"#075070"});
  deco("palm",520,390,{scale:1});
  deco("rug",80,384,{w:230});

  deco("column",760,390,{h:210});
  deco("column",1160,390,{h:210});
  deco("statue",980,390,{scale:1});
  deco("banner",1090,170,{h:100,color1:"#ffd866",color2:"#9a5b28"});

  deco("arch",1370,390,{w:180,h:240});
  deco("arch",1660,390,{w:180,h:240});
  deco("rug",1345,384,{w:360});
  deco("statue",1810,390,{scale:.95});

  deco("banner",1910,100,{h:140,color1:"#ffde6a",color2:"#7a441f"});
  deco("banner",2110,100,{h:140,color1:"#ffde6a",color2:"#7a441f"});
  deco("gem",2035,190,{r:22});

  deco("column",2380,390,{h:200});
  deco("column",2580,390,{h:200});
  deco("palm",2860,390,{scale:.9});
  deco("rug",2740,384,{w:260});

  deco("arch",3420,390,{w:190,h:250});
  deco("arch",3700,390,{w:190,h:250});
  deco("banner",3650,130,{h:150,color1:"#9f263a",color2:"#42101a"});
  deco("statue",3890,390,{scale:1.1});

  deco("boss_gate",4030,390,{w:120,h:260});
  deco("boss_gate",5060,390,{w:120,h:260});
  deco("column",4330,390,{h:260});
  deco("column",4920,390,{h:260});
  deco("banner",4500,110,{h:165,color1:"#ff3040",color2:"#501018"});
  deco("banner",4740,110,{h:165,color1:"#ff3040",color2:"#501018"});
  deco("rug",4300,384,{w:780});
}

function makeEnemy(x,y,left,right){
  return {
    x,y,w:38,h:62,
    vx:120,
    vy:0,
    dir:1,
    left,
    right,
    hp:3,
    maxHp:3,
    inv:0,
    dead:false,
    lastHit:-1,
    onGround:false
  };
}

function makeBoss(){
  return {
    x:4480,
    y:260,
    w:92,
    h:118,
    vx:0,
    vy:0,
    dir:-1,
    hp:18,
    maxHp:18,
    inv:0,
    dead:false,
    active:false,
    onGround:false,
    mode:"sleep",
    timer:0,
    attackCd:1.2,
    slamWave:0,
    lastHit:-1
  };
}

function startGame(){
  ensureAudio();
  buildLevel();

  player = {
    x:70,
    y:280,
    w:38,
    h:64,
    vx:0,
    vy:0,
    dir:1,
    speed:330,
    jump:690,
    onGround:false,
    coyote:0,
    jumpBuffer:0,
    prevJump:false,
    hp:6,
    maxHp:6,
    inv:0,
    attack:0,
    attackCd:0,
    attackId:0,
    hasKey:false
  };

  keyItem.taken = false;

  enemies = [
    makeEnemy(850,330,735,1160),
    makeEnemy(1500,330,1340,1830),
    makeEnemy(2850,330,2730,3190),
    makeEnemy(3630,330,3390,3880)
  ];

  boss = makeBoss();

  particles = [];
  floatTexts = [];

  state.screen = "game";
  state.time = 0;
  state.cameraX = 0;
  state.shake = 0;
  state.msg = "SAND PRINCE 2026 PRO v2";
  state.msgTime = 2.4;
  state.finished = false;

  clearAllInput();
}

/* =========================
   INPUT
========================= */

function pointerPos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

function controls(){
  return {
    left:{x:34,y:468,w:135,h:54},
    right:{x:188,y:468,w:135,h:54},
    jump:{x:620,y:468,w:135,h:54},
    attack:{x:776,y:468,w:150,h:54}
  };
}

function pauseRect(){
  return {x:W-66,y:76,w:46,h:38};
}

function updateMobile(){
  mobile.left = mobile.right = mobile.jump = mobile.attack = false;
  const b = controls();

  for(const p of activePointers.values()){
    if(inside(p.x,p.y,b.left)) mobile.left = true;
    if(inside(p.x,p.y,b.right)) mobile.right = true;
    if(inside(p.x,p.y,b.jump)) mobile.jump = true;
    if(inside(p.x,p.y,b.attack)) mobile.attack = true;
  }
}

function clearMobile(){
  activePointers.clear();
  mobile.left = mobile.right = mobile.jump = mobile.attack = false;
}

function clearAllInput(){
  keys = {};
  clearMobile();
}

function togglePause(){
  if(state.screen === "game"){
    state.screen = "pause";
    clearMobile();
    sound("click");
  }else if(state.screen === "pause"){
    state.screen = "game";
    clearMobile();
    sound("click");
  }
}

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  ensureAudio();

  canvas.setPointerCapture?.(e.pointerId);
  const p = pointerPos(e);

  if(state.screen === "game"){
    if(inside(p.x,p.y,pauseRect())){
      togglePause();
      return;
    }

    activePointers.set(e.pointerId,p);
    updateMobile();
    return;
  }

  handleButtons(p);
});

canvas.addEventListener("pointermove",e=>{
  if(state.screen !== "game") return;
  e.preventDefault();
  activePointers.set(e.pointerId,pointerPos(e));
  updateMobile();
});

for(const ev of ["pointerup","pointercancel","pointerleave","lostpointercapture"]){
  canvas.addEventListener(ev,e=>{
    activePointers.delete(e.pointerId);
    updateMobile();
  });
}

window.addEventListener("blur",clearAllInput);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) clearAllInput(); });

window.addEventListener("keydown",e=>{
  const k = e.key.toLowerCase();

  if([" ","arrowleft","arrowright","arrowup"].includes(k)) e.preventDefault();

  ensureAudio();
  keys[k] = true;

  if(k==="escape" || k==="p" || k==="з"){
    if(state.screen==="game" || state.screen==="pause") togglePause();
  }

  if(k==="r" && state.screen!=="menu") startGame();
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;
});

/* =========================
   UPDATE
========================= */

function update(dt){
  updateParticles(dt);
  updateTexts(dt);

  if(state.screen !== "game") return;

  state.time += dt;
  if(state.msgTime > 0) state.msgTime -= dt;

  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateCamera();

  if(player.hp <= 0){
    state.screen = "over";
    clearMobile();
  }
}

function updatePlayer(dt){
  const left = keys["a"] || keys["ф"] || keys["arrowleft"] || mobile.left;
  const right = keys["d"] || keys["в"] || keys["arrowright"] || mobile.right;
  const jump = keys["w"] || keys["ц"] || keys["arrowup"] || keys[" "] || mobile.jump;
  const attack = keys["j"] || keys["о"] || keys["x"] || keys["ч"] || mobile.attack;

  let move = 0;
  if(left) move--;
  if(right) move++;

  if(move){
    player.vx = move * player.speed;
    player.dir = move > 0 ? 1 : -1;
  }else{
    player.vx *= player.onGround ? .77 : .94;
    if(Math.abs(player.vx)<4) player.vx = 0;
  }

  if(jump && !player.prevJump) player.jumpBuffer = .16;
  player.prevJump = jump;

  if(player.onGround) player.coyote = .13;
  else player.coyote -= dt;

  player.jumpBuffer -= dt;

  if(player.jumpBuffer > 0 && player.coyote > 0){
    player.vy = -player.jump;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    particlesBurst(player.x+player.w/2,player.y+player.h,"#eaf6ff",12);
    sound("jump");
  }

  if(!jump && player.vy < -170) player.vy *= .93;

  if(attack) startAttack();

  if(player.attack > 0) player.attack -= dt;
  if(player.attackCd > 0) player.attackCd -= dt;
  if(player.inv > 0) player.inv -= dt;

  moveEntity(player,dt);

  checkSpikes();
  checkKeyDoor();
  checkAttack();

  if(player.y > GAME_H + 100) damagePlayer(1,true);

  if(player.x > 4100 && boss && !boss.active && !boss.dead){
    boss.active = true;
    boss.mode = "wake";
    boss.timer = 1;
    state.msg = "ПРОБУДИЛСЯ СТРАЖ ЗОЛОТОГО ДВОРЦА";
    state.msgTime = 2.4;
    state.shake = 12;
    sound("boss");
  }
}

function startAttack(){
  if(player.attackCd > 0) return;

  player.attack = .18;
  player.attackCd = .34;
  player.attackId++;

  particlesBurst(player.x+player.w/2+player.dir*34,player.y+30,"#fff1b8",8);
  sound("slash");
}

function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead) continue;

    if(e.inv > 0) e.inv -= dt;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const near = Math.abs(dx)<170 && Math.abs(dy)<90;

    if(near){
      e.dir = dx > 0 ? 1 : -1;
      e.vx = e.dir * 155;
    }else{
      if(e.x <= e.left){
        e.dir = 1;
        e.vx = 120;
      }
      if(e.x >= e.right){
        e.dir = -1;
        e.vx = -120;
      }
    }

    moveEntity(e,dt);

    e.x = clamp(e.x,e.left,e.right);

    if(rectOverlap(player,e) && player.inv <= 0){
      damagePlayer(1,false);
      player.vx = e.dir * 240;
      player.vy = -260;
    }
  }
}

function updateBoss(dt){
  if(!boss || boss.dead) return;

  if(boss.inv > 0) boss.inv -= dt;

  if(!boss.active){
    moveEntity(boss,dt);
    return;
  }

  boss.timer -= dt;
  boss.attackCd -= dt;

  const dx = player.x + player.w/2 - (boss.x + boss.w/2);
  boss.dir = dx > 0 ? 1 : -1;

  if(boss.mode === "wake"){
    boss.vx = 0;

    if(boss.timer <= 0){
      boss.mode = "chase";
      boss.attackCd = .9;
    }
  }

  else if(boss.mode === "chase"){
    boss.vx = boss.dir * 105;

    if(Math.abs(dx)<145 && boss.attackCd <= 0){
      boss.mode = Math.random() < .55 ? "slam" : "dash";
      boss.timer = boss.mode === "slam" ? .58 : .48;
      boss.vx = 0;
    }
  }

  else if(boss.mode === "slam"){
    boss.vx = 0;

    if(boss.timer <= 0){
      boss.mode = "chase";
      boss.attackCd = 1.15;
      boss.slamWave = .45;
      state.shake = 16;
      particlesBurst(boss.x+boss.w/2,boss.y+boss.h,"#ffd866",48);
      sound("boss");

      const px = player.x + player.w/2;
      const bx = boss.x + boss.w/2;

      if(Math.abs(px-bx)<175 && player.onGround){
        damagePlayer(1,false);
        player.vx = Math.sign(px-bx || 1) * 360;
        player.vy = -280;
      }
    }
  }

  else if(boss.mode === "dash"){
    boss.vx = boss.dir * 360;

    if(boss.timer <= 0){
      boss.mode = "chase";
      boss.attackCd = 1.35;
      boss.vx = 0;
    }
  }

  if(boss.slamWave > 0) boss.slamWave -= dt;

  moveEntity(boss,dt);
  boss.x = clamp(boss.x,4060,5010);

  if(rectOverlap(player,boss) && player.inv <= 0){
    damagePlayer(1,false);
    player.vx = boss.dir * 330;
    player.vy = -300;
  }
}

function moveEntity(e,dt){
  e.x += e.vx * dt;

  for(const p of platforms){
    if(rectOverlap(e,p)){
      if(e.vx > 0) e.x = p.x - e.w;
      else if(e.vx < 0) e.x = p.x + p.w;
      e.vx = 0;
    }
  }

  e.vy += GRAVITY * dt;
  e.y += e.vy * dt;
  e.onGround = false;

  for(const p of platforms){
    if(rectOverlap(e,p)){
      if(e.vy > 0){
        e.y = p.y - e.h;
        e.onGround = true;
      }else if(e.vy < 0){
        e.y = p.y + p.h;
      }
      e.vy = 0;
    }
  }

  e.x = clamp(e.x,0,WORLD_W-e.w);
}

function updateCamera(){
  let target = player.x + player.w/2 - W*.38;

  if(boss && boss.active && !boss.dead && player.x > 4100){
    target = 4080;
  }

  state.cameraX += (target-state.cameraX)*.08;
  state.cameraX = clamp(state.cameraX,0,WORLD_W-W);
}

function checkSpikes(){
  for(const s of spikes){
    if(rectOverlap(player,s)){
      damagePlayer(1,true);
      return;
    }
  }
}

function damagePlayer(amount,respawn){
  if(player.inv > 0) return;

  player.hp -= amount;
  player.inv = .9;
  state.shake = 8;

  particlesBurst(player.x+player.w/2,player.y+player.h/2,"#ff5470",24);
  addText("-"+amount,player.x+player.w/2,player.y-12,"#ff7890");
  sound("hurt");

  if(respawn && player.hp > 0){
    player.x = Math.max(70,state.cameraX+80);
    player.y = 250;
    player.vx = 0;
    player.vy = 0;
  }
}

function checkKeyDoor(){
  if(!keyItem.taken){
    const px = player.x + player.w/2;
    const py = player.y + player.h/2;

    if(dist(px,py,keyItem.x,keyItem.y)<42){
      keyItem.taken = true;
      player.hasKey = true;
      state.msg = "Ключ найден. Теперь найди стража дворца.";
      state.msgTime = 2.7;
      particlesBurst(keyItem.x,keyItem.y,"#ffd866",48);
      addText("КЛЮЧ",keyItem.x,keyItem.y-30,"#ffd866");
      sound("key");
    }
  }

  if(rectOverlap(player,door)){
    if(!player.hasKey){
      state.msg = "Ворота закрыты. Нужен ключ.";
      state.msgTime = 1.5;
      return;
    }

    if(boss && !boss.dead){
      state.msg = "Магия стража держит ворота закрытыми.";
      state.msgTime = 1.8;
      return;
    }

    winGame();
  }
}

function checkAttack(){
  if(player.attack <= 0) return;

  const ar = attackRect();

  for(const e of enemies){
    if(e.dead || e.lastHit === player.attackId) continue;

    if(rectOverlap(ar,e)){
      e.lastHit = player.attackId;
      e.hp--;
      e.inv = .22;
      e.vx = player.dir * 250;
      e.vy = -120;

      particlesBurst(e.x+e.w/2,e.y+e.h/2,"#ffd2a1",22);
      addText("-1",e.x+e.w/2,e.y-10,"#ffd2a1");
      state.shake = 3;
      sound("hit");

      if(e.hp <= 0){
        e.dead = true;
        particlesBurst(e.x+e.w/2,e.y+e.h/2,"#ffb347",45);
        addText("ПОБЕЖДЁН",e.x+e.w/2,e.y-18,"#ffd866");
      }
    }
  }

  if(boss && boss.active && !boss.dead && boss.lastHit !== player.attackId && rectOverlap(ar,boss)){
    boss.lastHit = player.attackId;
    boss.hp--;
    boss.inv = .18;
    boss.vx = player.dir * 120;

    particlesBurst(boss.x+boss.w/2,boss.y+boss.h/2,"#ffe08a",28);
    addText("-1",boss.x+boss.w/2,boss.y-10,"#ffe08a");
    state.shake = 5;
    sound("hit");

    if(boss.hp <= 0){
      boss.dead = true;
      save.bossKills++;
      saveGame();

      state.msg = "СТРАЖ ПОВЕРЖЕН. ВОРОТА ОТКРЫТЫ.";
      state.msgTime = 3;
      state.shake = 20;

      particlesBurst(boss.x+boss.w/2,boss.y+boss.h/2,"#ffd866",120);
      addText("БОСС ПОБЕЖДЁН",boss.x+boss.w/2,boss.y-24,"#ffd866");
      sound("win");
    }
  }
}

function attackRect(){
  if(player.dir > 0){
    return {x:player.x+player.w-4,y:player.y+20,w:74,h:28};
  }
  return {x:player.x-70,y:player.y+20,w:74,h:28};
}

function winGame(){
  if(state.finished) return;

  state.finished = true;
  state.screen = "win";
  save.wins++;

  if(!save.bestTime || state.time < save.bestTime){
    save.bestTime = state.time;
  }

  saveGame();
  clearMobile();
  sound("win");
}

/* =========================
   PARTICLES
========================= */

function particlesBurst(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:rand(-130,130),
      vy:rand(-190,80),
      life:rand(.25,.85),
      max:.85,
      color,
      size:rand(2,5)
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 520 * dt;
    p.life -= dt;

    if(p.life <= 0) particles.splice(i,1);
  }
}

function addText(text,x,y,color){
  floatTexts.push({text,x,y,color,life:.9,max:.9});
}

function updateTexts(dt){
  for(let i=floatTexts.length-1;i>=0;i--){
    const t = floatTexts[i];
    t.y -= 38 * dt;
    t.life -= dt;

    if(t.life <= 0) floatTexts.splice(i,1);
  }
}

/* =========================
   DRAW MAIN
========================= */

function draw(){
  ctx.save();

  if(state.shake > 0){
    ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));
    state.shake *= .82;
    if(state.shake < .2) state.shake = 0;
  }

  drawBackground();

  if(state.screen === "menu") drawMenu();
  else{
    drawWorld();

    if(state.screen === "game") drawControls();
    if(state.screen === "pause"){
      drawControls();
      drawPause();
    }
    if(state.screen === "over") drawOver();
    if(state.screen === "win") drawWin();
  }

  ctx.restore();
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,GAME_H);
  sky.addColorStop(0,"#111b3f");
  sky.addColorStop(.45,"#402454");
  sky.addColorStop(1,"#d68348");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,GAME_H);

  ctx.fillStyle = "#070918";
  ctx.fillRect(0,GAME_H,W,H-GAME_H);

  const cam = state.cameraX;
  const sunX = 760 - cam*.03;
  const sunY = 88;

  const glow = ctx.createRadialGradient(sunX,sunY,12,sunX,sunY,150);
  glow.addColorStop(0,"rgba(255,230,150,.8)");
  glow.addColorStop(.35,"rgba(255,175,90,.22)");
  glow.addColorStop(1,"rgba(255,150,40,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(sunX-160,sunY-160,320,320);

  ctx.fillStyle = "#ffe6a5";
  ctx.beginPath();
  ctx.arc(sunX,sunY,28,0,Math.PI*2);
  ctx.fill();

  drawPalaceLayer(cam,.12,250,"#111a34","#1e2c55");
  drawPalaceLayer(cam,.25,310,"#17203e","#293b6c");
  drawPalaceLayer(cam,.42,365,"#25274a","#47355e");

  const fog = ctx.createLinearGradient(0,300,0,GAME_H);
  fog.addColorStop(0,"rgba(255,210,140,0)");
  fog.addColorStop(1,"rgba(255,190,115,.26)");
  ctx.fillStyle = fog;
  ctx.fillRect(0,250,W,GAME_H-250);
}

function drawPalaceLayer(cam,speed,baseY,dark,light){
  ctx.save();
  ctx.translate(-cam*speed,0);

  for(let i=-2;i<30;i++){
    const x = i*210;
    const h = 120 + (i%4)*35;

    const g = ctx.createLinearGradient(x,baseY-h,x,baseY);
    g.addColorStop(0,light);
    g.addColorStop(1,dark);

    ctx.fillStyle = g;
    roundRect(x,baseY-h,120,h,10);
    ctx.fill();

    ctx.fillStyle = "rgba(255,220,150,.15)";
    for(let w=0;w<3;w++){
      ctx.fillRect(x+22+w*30,baseY-h+35,12,26);
      ctx.fillRect(x+22+w*30,baseY-h+80,12,26);
    }

    ctx.beginPath();
    ctx.moveTo(x-10,baseY-h+5);
    ctx.lineTo(x+60,baseY-h-48);
    ctx.lineTo(x+130,baseY-h+5);
    ctx.closePath();
    ctx.fillStyle = light;
    ctx.fill();
  }

  ctx.restore();
}

function drawWorld(){
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,GAME_H);
  ctx.clip();

  ctx.translate(-Math.floor(state.cameraX),0);

  drawDecorBack();
  drawTorchLights();

  for(const p of platforms){
    if(visible(p)) drawPlatform(p);
  }

  drawSpikes();
  drawDoor();

  if(!keyItem.taken) drawKey();

  for(const t of torches){
    if(t.x > state.cameraX-100 && t.x < state.cameraX+W+100) drawTorch(t);
  }

  for(const e of enemies) drawEnemy(e);
  if(boss) drawBoss();
  if(player) drawPlayer();

  drawDecorFront();
  drawParticlesWorld();
  drawTextsWorld();

  ctx.restore();

  drawHud();
}

function visible(r){
  return r.x+r.w > state.cameraX-100 && r.x < state.cameraX+W+100;
}

function drawPlatform(p){
  let top1 = "#f1c27a";
  let top2 = "#c98946";
  let front1 = "#9a6031";
  let front2 = "#62391f";

  if(p.color === "dark"){
    top1 = "#68718f";
    top2 = "#3e4965";
    front1 = "#31384f";
    front2 = "#191f31";
  }

  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(p.x+p.w/2,p.y+p.h+14,p.w/2,22,0,0,Math.PI*2);
  ctx.fill();

  const gTop = ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
  gTop.addColorStop(0,top1);
  gTop.addColorStop(1,top2);

  ctx.fillStyle = gTop;
  roundRect(p.x,p.y,p.w,p.h*.55,10);
  ctx.fill();

  const gFront = ctx.createLinearGradient(p.x,p.y+p.h*.45,p.x,p.y+p.h);
  gFront.addColorStop(0,front1);
  gFront.addColorStop(1,front2);

  ctx.fillStyle = gFront;
  ctx.fillRect(p.x,p.y+p.h*.45,p.w,p.h*.55);

  ctx.strokeStyle = "rgba(255,255,255,.13)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p.x+10,p.y+8);
  ctx.lineTo(p.x+p.w-12,p.y+8);
  ctx.stroke();
}

function drawSpikes(){
  for(const s of spikes){
    const count = Math.max(1,Math.floor(s.w/12));

    ctx.fillStyle = "#3c2a28";
    ctx.fillRect(s.x-4,s.y+s.h-4,s.w+8,7);

    for(let i=0;i<count;i++){
      const x = s.x+i*12;
      const g = ctx.createLinearGradient(x,s.y,x,s.y+s.h);
      g.addColorStop(0,"#fff");
      g.addColorStop(.5,"#aeb6c2");
      g.addColorStop(1,"#49515e");

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x,s.y+s.h);
      ctx.lineTo(x+6,s.y);
      ctx.lineTo(x+12,s.y+s.h);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* =========================
   DECOR
========================= */

function drawDecorBack(){
  for(const d of decor){
    if(d.x < state.cameraX-250 || d.x > state.cameraX+W+250) continue;

    if(d.type==="arch") drawArch(d);
    if(d.type==="banner") drawBanner(d);
    if(d.type==="column") drawColumn(d);
    if(d.type==="statue") drawStatue(d);
    if(d.type==="palm") drawPalm(d);
    if(d.type==="gem") drawGemDecor(d);
    if(d.type==="boss_gate") drawBossGate(d);
  }
}

function drawDecorFront(){
  for(const d of decor){
    if(d.x < state.cameraX-250 || d.x > state.cameraX+W+250) continue;
    if(d.type==="rug") drawRug(d);
  }

  ctx.save();
  ctx.globalAlpha = .12;
  ctx.fillStyle = "#ffd18a";

  for(let i=0;i<12;i++){
    const x = state.cameraX + i*120 + Math.sin(performance.now()/900+i)*20;
    const y = 405 + Math.sin(performance.now()/700+i)*8;
    ctx.beginPath();
    ctx.ellipse(x,y,90,12,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "rgba(255,220,150,.28)";

function drawBanner(d){

function drawColumn(d){
  const x=d.x,y=d.y,h=d.h||210;

function drawPalm(d){

function drawTorchLights(){
  const t = performance.now()/1000;

  for(const torch of torches){

    const flick = 75 + Math.sin(t*8+torch.x)*12;
    const g = ctx.createRadialGradient(torch.x,torch.y,4,torch.x,torch.y,flick);

    g.addColorStop(0,"rgba(255,218,100,.4)");
    g.addColorStop(.35,"rgba(255,130,40,.17)");
    g.addColorStop(1,"rgba(255,90,20,0)");

function drawParticlesWorld(){
  for(const p of particles){

    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawTextsWorld(){
  ctx.textAlign = "center";
  ctx.font = "bold 18px Arial";

  for(const t of floatTexts){
    ctx.globalAlpha = Math.max(0,t.life/t.max);

    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillText(t.text,t.x+2,t.y+2);

    ctx.fillStyle = t.color;
    ctx.fillText(t.text,t.x,t.y);

function handleButtons(p){
  for(const b of buttons){
    if(inside(p.x,p.y,b)){
      sound("click");
      b.onClick();
      return;
    }
  }
}

/* =========================
   HELPERS
========================= */

function rectOverlap(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function inside(x,y,r){
  return x >= r.x &&
         x <= r.x+r.w &&
         y >= r.y &&
         y <= r.y+r.h;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function rand(min,max){
  return min + Math.random()*(max-min);
}

function dist(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}

function formatTime(seconds){
  seconds = Math.floor(seconds);
  const m = Math.floor(seconds/60);
  const s = seconds % 60;
  return m + ":" + String(s).padStart(2,"0");
}

function roundRect(x,y,w,h,r){
  r = Math.min(r,w/2,h/2);

  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* =========================
   LOOP
========================= */

function loop(now){
  const dt = Math.min(.033,(now-last)/1000);
  last = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

// Защита от залипания кнопок на телефоне.
function safetyInput(){
  if(activePointers.size === 0){
    mobile.left = mobile.right = mobile.jump = mobile.attack = false;
  }
  requestAnimationFrame(safetyInput);
}

buildLevel();
requestAnimationFrame(loop);
requestAnimationFrame(safetyInput);
